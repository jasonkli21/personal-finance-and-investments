name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://portfolio:test-only@127.0.0.1:5432/portfolio_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.13'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --directory services/api --locked
      - name: Lint, formatting, types, tests, and web build
        run: pnpm check
      - name: Install browser for offline journey
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Offline Stage 1 browser journey
        env:
          E2E_DISPOSABLE_DATABASE: '1'
          E2E_DATABASE_URL: postgresql+psycopg://portfolio:test-only@127.0.0.1:5432/portfolio_browser_test
        run: pnpm test:e2e
