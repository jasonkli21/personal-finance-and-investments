services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_BACKEND: ${DATABASE_BACKEND:-postgres}
      DEMO_MODE: ${DEMO_MODE:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-portfolio}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      DATABASE_NAME: ${POSTGRES_DB:-portfolio}
      AWS_REGION: ${AWS_REGION:-}
      AURORA_DSQL_CLUSTER_ENDPOINT: ${AURORA_DSQL_CLUSTER_ENDPOINT:-}
      AURORA_DSQL_DB_USER: ${AURORA_DSQL_DB_USER:-}
      AURORA_DSQL_MIGRATION_DB_USER: ${AURORA_DSQL_MIGRATION_DB_USER:-}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-3000}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      PRIVATE_FILE_DIR: /app/.private
      MAX_IMPORT_FILE_BYTES: ${MAX_IMPORT_FILE_BYTES:-5000000}
      MAX_IMPORT_ROWS: ${MAX_IMPORT_ROWS:-5000}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-40}
      PDF_PARSER_TIMEOUT_SECONDS: ${PDF_PARSER_TIMEOUT_SECONDS:-8}
      JOB_WORKER_ENABLED: ${JOB_WORKER_ENABLED:-true}
      JOB_POLL_INTERVAL_SECONDS: ${JOB_POLL_INTERVAL_SECONDS:-1}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-30}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      PERSONAL_AI_ENABLED: ${PERSONAL_AI_ENABLED:-false}
    volumes:
      - private_files:/app/.private
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  private_files:
