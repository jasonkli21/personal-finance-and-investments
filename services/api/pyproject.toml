[project]
name = "portfolio-api"
version = "0.1.0"
description = "Local-first portfolio intelligence API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "authlib>=1.8,<2",
    "google-cloud-storage>=3.4,<4",
    "google-cloud-run>=0.11,<1",
    "cryptography>=45,<51",
    "fastapi>=0.115,<1",
    "httpx2>=2.13,<3",
    "itsdangerous>=2.2,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "pypdf>=6.19,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Applied migrations are immutable. Keep lint/runtime validation for these two
# historical files, whose formatting predates the current whole-tree gate.
exclude = [
    "alembic/versions/0007_stage2_document_ingestion.py",
    "alembic/versions/0015_stage4_authentication.py",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
warn_unreachable = true
